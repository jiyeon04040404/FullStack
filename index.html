<!DOCTYPE html>
<!--
  [시작 페이지 - 자동 이동]
  - 이 페이지로 들어오면 춘봉 포털 메인(html/portal.html)으로 바로 이동
  - meta refresh + JavaScript 두 가지 방식으로 이동 처리
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=html/portal.html">
    <title>춘봉 - 이동 중</title>
    <script>
        location.replace("html/portal.html");
    </script>
</head>
<body>
    <p>춘봉 포털로 이동 중입니다. 자동으로 이동하지 않으면 <a href="html/portal.html">여기</a>를 눌러 주세요.</p>
</body>
</html>
