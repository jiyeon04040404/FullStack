<!DOCTYPE html>
<!--
  [CSS 선택자 연습 페이지]
  - 3가지 CSS 선택자로 스타일을 적용하는 연습용 웹페이지 (HTML + CSS)
  - 태그 선택자: p      → 같은 태그 전체에 적용
  - 클래스 선택자: .red   → class="red"인 요소에 적용 (여러 요소에 반복 사용 가능)
  - 아이디 선택자: #green → id="green"인 요소에 적용 (페이지에서 한 번만 사용)
  - 디자인은 style2.css 파일에서 적용
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style2.css">
    <title>춘봉이는 신이다</title>
</head>
<body>
    <p class="intro">춘봉이가 태그를 이용합니다.</p>
    <div class="red">춘봉이는 class도 써요.</div>
    <div id="green">#을 이용한 춘봉이입니다.</div>

    <img
        src="춘3.jpg"
        width="200"
    >
</body>
</body>
</html>
