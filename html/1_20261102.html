<!DOCTYPE html>
<!--
  [자기소개 페이지]
  - 나를 소개하는 정적 웹페이지 (HTML만 사용, CSS 없음)
  - 구조: header(인사말) / main(나에 대해, 과정 목표, 링크) / footer
  - 사용 태그: 제목(h1, h2), 문단(p), 이미지(img), 목록(ul, li), 링크(a)
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>춘봉이는 신이다</title>
</head>
<body>
  <body>
  <header>
    <h1>안녕하세요, 지연입니다!</h1>
    <p>직접 사용하는 서비스를 만들고 싶습니다.</p>
  </header>

  <main>
    <section>
      <h2>나에 대해</h2>

      <img
        src="춘.jpg"
        alt="나의 관심사를 표현하는 이미지"
        width="200"
      >

      <p>저는 웹 개발을 공부하고 있습니다.</p>
      <p>취미는 산책과 음악 감상입니다.</p>
    </section>

    <section>
      <h2>이번 과정의 목표</h2>

      <ul>
        <li>웹페이지의 구조 이해하기</li>
        <li>나에게 필요한 기능 만들기</li>
        <li>다른 사람에게 서비스 보여주기</li>
      </ul>
    </section>

    <section>
      <h2>나의 링크</h2>

      <p>
        <a href="https://github.com/">GitHub 방문하기</a>
      </p>
    </section>
  </main>

  <footer>
    <p>지연의 학습 기록</p>
  </footer>
</body>
</html>
