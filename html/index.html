<!DOCTYPE html>
<!--
  [춘봉이 프로필 카드 페이지]
  - 첫 번째 소개 페이지 내용을 카드 형태로 꾸민 웹페이지 (HTML + CSS)
  - 전체 내용을 div.profile-card로 감싸서 하나의 카드처럼 스타일 적용
  - 구조: header(인사말) / main(소개, 좋아하는 것, 링크) / footer
  - 디자인은 style3.css 파일에서 적용
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style3.css">
    <title>춘봉이는 신이다</title>
</head>
<body>
    <div class="profile-card">
        <header>
            <h1>안녕하세요, 신도 1입니다!</h1>
            <p>오늘은 제가 모시는 신을 소개드리려 합니다.</p>
        </header>

        <main>
            <section>
            <h2>춘봉이에 대해</h2>

            <img
                src="춘2.jpg"
                alt="'그녀'의 존안"
                width="200"
            >

            <p>춘봉이는 경주에 사는 어느 한 박씨 집안의 여섯째입니다.</p>
            <p>취미는 땅굴 파기와 챗바퀴 굴리기입니다.</p>
            </section>

            <section>
            <h2>좋아하는 것</h2>

            <ul>
                <li>채소, 과일 다 잘 먹습니다.</li>
                <li>집사가 퇴근하고 이름을 불러줄 때, 쪼르르 달려나가기</li>
                <li>먹는 것</li>
            </ul>
            </section>

            <section>
            <h2>춘봉이를 모시는 집사의 친구가 운영하는 깃 링크</h2>

            <p>
                <a href="https://github.com/">GitHub</a>
            </p>
            </section>
        </main>

        <footer>
            <p>춘봉이 관찰 기록</p>
        </footer>
</body>
</html>
