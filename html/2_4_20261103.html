<!DOCTYPE html>
<!--
  [CSS 스타일 연습 페이지]
  - 글(div)과 이미지(img)에 CSS를 적용해 보는 연습용 웹페이지 (HTML + CSS)
  - 구성: 텍스트 박스 1개 + 춘봉이 사진 1장
  - 디자인은 style4.css 파일에서 적용
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style4.css">
    <title>춘봉이는 신이다</title>
</head>
<body>
    <div>춘봉이가 귀엽습니다.</div>

    <img
        src="춘3.jpg"
        width="200"
    >
</body>
</html>
